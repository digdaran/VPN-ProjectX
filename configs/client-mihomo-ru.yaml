# ============================================================
# ШАБЛОН MIHOMO ДЛЯ REMNAWAVE ОТ ROSCOMVPN — ФОРК ДЛЯ VPN-PROJECTX
# ============================================================
# Набор правил RoscomVPN, адаптированный для Mihomo
#
# Режим:       rule
# Инбаунды:    TUN (system, strict-route), mixed-port 7890
#              Приватные и зарезервированные IP исключены из TUN и сниффера
# DNS:         fake-ip, Yandex DNS (direct) + Google DNS (proxy)
#              IPv6 в DNS отключён, весь IPv6-трафик ядра блокируется на уровне правил
#
# Группы прокси:
#   🛡️ VPN       — основная группа (по умолчанию)
#   ⚡️ Авто      — автовыбор по задержке (url-test, интервал 5 мин)
#   📺 Youtube   — отдельный выбор узла для YouTube
#   💬 Discord   — ВЫКЛЮЧЕНО ПО УМОЛЧАНИЮ в форке VPN-ProjectX, см. правку ниже
#   🎮 Игры      — ВЫКЛЮЧЕНО ПО УМОЛЧАНИЮ в форке VPN-ProjectX, см. правку ниже
#   🔓 Без VPN   — принудительный прямой доступ (DIRECT)
#   ⛔ Блок      — блокировка (REJECT)
#   ⏭️ Пропуск   — PASS (передать следующему правилу)
#
# Rule-sets (репозитории hydraponique / RoscomVPN на GitHub):
#   • Реклама и слежка Windows              → REJECT-DROP
#   • Торренты (домены/клиенты)             → DIRECT
#   • Microsoft, Apple                      → DIRECT
#   • Российские домены (category-ru), ru-apps → DIRECT
#   • Twitch, Pinterest                     → DIRECT
#   • YouTube, Telegram, GitHub             → PROXY
#   • Игровые сервисы                       → закомментированы, см. правку VPN-ProjectX ниже
#   • Остальное                             → PROXY
#
# UDP-порт 443/853 (QUIC/DoQ) блокируется глобально.
#
# Разработка: ristavor
# Благодарности: hydraponique & fatyzzz
# Группа RoscomVPN в Telegram: https://t.me/vpnrouting
#
# Будем благодарны любой поддержке:
# USDT TRC20 — TMu3N2ZjK5omJ7n3WAj5MNCSM5querBXsR
# ============================================================
#
# --- ФОРК ДЛЯ VPN-PROJECTX (2026-08-15) ---
# Подробное описание — docs/client-templates.md (что это, как включить в
# панели, таблица клиент → формат → файл этого репозитория).
# Источник: https://raw.githubusercontent.com/remnawave/templates/refs/heads/main/by-roscomvpn/subscription-templates/roscomvpn-mihomo-ru.yaml
# (список шаблонов: https://github.com/remnawave/templates/blob/main/subscription-templates-list.json)
#
# Как сюда попал: разбор пробной подписки стороннего RU-VPN сервиса (vk-proxy.com)
# показал, что их Clash/Mihomo-ответ на этот же UA почти дословно совпадает с этим
# публичным шаблоном — то есть их «продуманная маршрутизация» это готовый открытый
# билдинг-блок из экосистемы Remnawave, а не собственная разработка конкурента.
# Разумнее взять его напрямую, чем реверсить их копию.
#
# ЭТО НЕ configs/client-example.json И НЕ configs/client-multi-profile.json.
# Те — обычный Xray JSON, деплоятся руками/через профиль в любом Xray-клиенте
# (включая INCY — см. https://docs.rw/clients/, у него нативный формат именно такой).
# Этот файл — YAML-ШАБЛОН ДЛЯ ПАНЕЛИ: загружается в Remnawave → Templates как тип
# MIHOMO, и подписка ОТДАЁТ ЕГО автоматически клиентам с UA, похожим на
# Clash/Mihomo/Stash/Karing (см. Subscription → Response Rules / Routing Rules,
# доступно с Remnawave 2.2.0: https://docs.rw/learn-en/templates/).
# INCY-подобные и голые Xray-клиенты продолжают получать client-example.json —
# этот файл их не заменяет, а покрывает отдельный сегмент клиентов.
#
# На preflight (scripts/50-preflight.sh) НЕ ПОПАДАЕТ: скрипт глобит только
# configs/*.json и configs/ready/*.json. Проверять этот файл — руками, особенно
# два маркера "# LEAVE THIS LINE!" ниже (строки-инъекции Remnawave: туда панель
# подставляет реальные vless-записи ваших нод). Их нельзя менять ни на символ —
# генератор Remnawave ищет их точным совпадением строки.
#
# JSON-инвариант из CLAUDE.md (configs/*.json ⟷ configs/ready/*.json, побайтовая
# сверка через strip_comments) на .yaml НЕ распространяется — здесь комментарии
# нативные (#), отдельного ready/-файла для этого шаблона не нужно.
#
# Что изменено относительно апстрима — минимально, только пояснения:
#   • Telegram оставлен PROXY (как у апстрима) — НЕ переносить в DIRECT бездумно,
#     даже если увидите такое в чужой подписке (у vk-proxy.com в их живом ответе
#     Telegram шёл через DIRECT — это их локальная правка поверх этого же шаблона).
#     DIRECT снижает нагрузку на тоннель, но делает телеграм-трафик видимым для
#     DPI как телеграм-трафик, а не как неотличимый шум внутри Reality. Тот же
#     компромисс уже описан в configs/client-hardened-routing.json.
#   • QUIC-блок (строка "AND,((NETWORK,UDP),(DST-PORT,443))...") — уже был у
#     апстрима, ничего не добавляли. Это тот же приём, что мы независимо
#     перенесли в configs/client-example.json как Xray routing-правило — здесь
#     он просто эффективнее: у Mihomo TUN-режим по умолчанию, значит правило
#     реально видит весь системный UDP, а не только то, что приложение само
#     решило послать через SOCKS.
#   • Торренты DIRECT (не через тоннель) — апстрим объясняет это скоростью;
#     для нас это ещё и защита белого IP выходных нод от жалоб на абьюз —
#     ровно то, что scripts/50-preflight.sh проверяет на СЕРВЕРНЫХ конфигах
#     (bittorrent-блок в routing). Здесь та же цель достигается на клиенте:
#     торрент-трафик вообще не доходит до наших VPS.
#   • Rule-sets (hydraponique/roscomvpn-geosite, roscomvpn/custom-category,
#     legiz-ru/mihomo-rule-sets) сознательно НЕ форкаем к себе — это активно
#     поддерживаемые сообществом списки, свой форк только протухнет без
#     сопровождения. Полагаемся на апстримные CDN-ссылки как есть.
#   • Игровые категории (Steam/Epic/Origin/Riot/EfT/FaceIT) и Discord.exe —
#     ЗАКОММЕНТИРОВАНЫ (2026-08-15, по решению для этого проекта: 10-100
#     личных пользователей, см. README «Область применения» — не игровой
#     сервис). Закомментированы, а не удалены: proxy-group, rule-providers и
#     rules остаются в файле как валидный, но неактивный YAML — раскомментируйте
#     все блоки, помеченные "ВКЛЮЧИТЬ ИГРЫ:"/"ВКЛЮЧИТЬ DISCORD:", если аудитория
#     изменится. Трафик этих категорий без явного правила не теряется — просто
#     попадает в общий MATCH,PROXY вместо отдельной группы выбора.
# ============================================================

mixed-port: 7890
mode: rule
log-level: silent
allow-lan: false
ipv6: true # для перехвата ipv6 трафика в ядро
unified-delay: true
tcp-concurrent: true
tun:
  enable: true
  stack: system
  auto-route: true
  auto-detect-interface: true
  dns-hijack:
    - any:53
  strict-route: true
  route-exclude-address: # исключаем из перехвата приватные и зарезервированные IP-адреса
    - 224.0.0.0/3
    - 10.0.0.0/8
    - 127.0.0.0/8
    - 100.64.0.0/10
    - 172.16.0.0/12
    - 169.254.0.0/16
    - 192.168.0.0/16
    - 192.0.0.0/24
    - 192.0.2.0/24
    - 192.88.99.0/24
    - 198.51.100.0/24
    - 203.0.113.0/24
    - fc00::/7
    - ff00::/8
    - fe80::/10
    - ::/127
dns:
  # Совпадает по духу с configs/client-example.json (77.88.8.8 для RU, google
  # для остального) — тот же принцип, независимо выбранный в обоих файлах.
  enable: true
  ipv6: false
  enhanced-mode: fake-ip # fake-ip/redir-host
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter:
    - rule-set:private-domains # исключить из fake-ip приватные домены
  default-nameserver:
    - https://77.88.8.8/dns-query
    - https://8.8.8.8/dns-query
  proxy-server-nameserver:
    - https://77.88.8.8/dns-query
    - https://8.8.8.8/dns-query
  direct-nameserver:
    - https://77.88.8.8/dns-query
    - https://8.8.8.8/dns-query
  nameserver:
    - https://8.8.8.8/dns-query#PROXY
sniffer:
  enable: true
  override-destination: false
  parse-pure-ip: true
  sniff:
    HTTP:
      ports:
        - 80
        - 8080-8880
    TLS:
      ports:
        - 443
        - 8443
  skip-dst-address: # исключить из сниффера приватные и зарезервированные IP-адреса
    - 224.0.0.0/3
    - 10.0.0.0/8
    - 127.0.0.0/8
    - 100.64.0.0/10
    - 172.16.0.0/12
    - 198.18.0.0/15
    - 169.254.0.0/16
    - 192.168.0.0/16
    - 192.0.0.0/24
    - 192.0.2.0/24
    - 192.88.99.0/24
    - 198.51.100.0/24
    - 203.0.113.0/24
    - fc00::/7
    - ff00::/8
    - fe80::/10
    - ::/127
find-process-mode: strict
profile:
  store-selected: true
  store-fake-ip: true
# ↓ НЕ ТРОГАТЬ строку ниже: маркер Remnawave, сюда генератор подставит
# реальные vless-записи ваших нод (ru-entry / exit-node DE-FR-NL-KZ) из панели.
proxies: # LEAVE THIS LINE!
proxy-groups:
  - name: 🛡️ VPN
    icon: https://cdn.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Hijacking.png
