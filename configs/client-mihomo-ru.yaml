    # LEAVE THIS LINE!
    url: https://www.gstatic.com/generate_204
  - name: 📺 Youtube
    icon: https://cdn.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/YouTube.png
    type: select
    remnawave:
      include-proxies: false
    include-all: true
    # filter: '🇫🇮 Finland' # Filter connections containing this value (hosts should be named like 🇫🇮 Finland1, 🇫🇮 Finland2, etc.)
    proxies:
      - 🛡️ VPN
      # Если хотите оставить на выбор только определенные узлы, воспользуйтесь filter
  # ВКЛЮЧИТЬ DISCORD: раскомментируйте блок ниже, если Discord.exe нужно
  # маршрутизировать отдельно от общей VPN-группы (не обязательно — работает
  # и без этого, просто через 🛡️ VPN). Заодно раскомментируйте два правила
  # PROCESS-NAME-REGEX в разделе rules: ниже.
  # - name: 💬 Discord.exe
