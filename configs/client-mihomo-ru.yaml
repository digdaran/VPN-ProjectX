  # ВКЛЮЧИТЬ ИГРЫ: раскомментируйте блок ниже вместе с rule-providers
  # (epicgames/origin/riot/escapefromtarkov/steam/faceit/games) и rules
  # (RULE-SET ... 🎮 Игры) — оба помечены тем же тегом ниже по файлу.
  # - name: 🎮 Игры
  #   icon: https://cdn.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Game.png
  #   type: select
  #   remnawave:
  #     include-proxies: false
  #   include-all: true
  #   proxies:
  #     - 🔓 Без VPN
  #     - 🛡️ VPN
  - name: ⚡️ Авто
    type: url-test
    tolerance: 150
    url: https://www.gstatic.com/generate_204
    interval: 300
    # exclude-filter: прокси, которые хотите исключить
    remnawave:
      include-proxies: false
    include-all: true
    hidden: true
  - name: PROXY
    type: select
    hidden: true
    remnawave:
      include-proxies: false
    proxies:
      - 🛡️ VPN
  - name: 🔓 Без VPN
    type: select
    hidden: true
    remnawave:
      include-proxies: false
    proxies:
      - DIRECT
  - name: ⛔ Блок
    type: select
    hidden: true
    remnawave:
      include-proxies: false
    proxies:
      - REJECT
  - name: ⏭️ Пропуск
    type: select
    hidden: true
    remnawave:
      include-proxies: false
    proxies:
      - PASS
