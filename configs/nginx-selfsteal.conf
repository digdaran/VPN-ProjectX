# /etc/nginx/sites-available/selfsteal
#
# SELF-STEAL для RU-ноды.
#
# Смысл: Reality на порту 443 при активном зондировании проксирует запрос
# на этот локальный nginx. Зонд получает настоящий сайт с настоящим
# сертификатом Let's Encrypt на ваш домен, чей A-record указывает на этот
# же IP. Ни одного несоответствия между SNI, сертификатом, ASN и IP.
#
# ВАЖНО: nginx слушает 127.0.0.1:8443, а НЕ 0.0.0.0:443.
# Порт 443 занимает Xray.

server {
    listen 127.0.0.1:8443 ssl;
    listen 127.0.0.1:8443 quic reuseport;
    http2 on;

    server_name vpn.example.ru;

    ssl_certificate     /etc/letsencrypt/live/vpn.example.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vpn.example.ru/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/vpn.example.ru/chain.pem;

    # Только TLS 1.2/1.3 — как у нормального современного сайта
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;

    root /var/www/selfsteal;
    index index.html;

    # Обычные заголовки настоящего сайта. Их отсутствие — тоже сигнал.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           "SAMEORIGIN" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;

    # Логи выключены: не храним ничего лишнего
    access_log off;
    error_log /var/log/nginx/selfsteal_error.log crit;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:css|js|jpg|jpeg|png|gif|ico|svg|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location = /robots.txt {
        add_header Content-Type text/plain;
        return 200 "User-agent: *\nAllow: /\n";
    }

    # Никаких /admin, /panel, /api и прочего, что выдаёт нестандартный хост
}

# HTTP :80 — нужен только для ACME-challenge и редиректа.
# Слушает на всех интерфейсах, потому что Let's Encrypt должен достучаться снаружи.
server {
    listen 80;
    listen [::]:80;
    server_name vpn.example.ru;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
